<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="imageContainer">
        <img src="Images/ArtLogoFinal.jpg" alt="High quality image of flowers in a field" width="100%" height="100%">
        <div class="label">
            <span class="formLabel">Art Gallery</span>            
        </div>
    </div>    
    <div class="formContainer">
        <div class="inputArea">

            <form action="" method="post">
                <span id="signUp">Sign-Up Form</span>                
                <div id="inputFields">
                    <div>    
                        <label for="fnameField">FIRST NAME</label>
                        <input id="fnameField" type="text">
                        <label for="emailField">EMAIL</label>
                        <input id="emailField" type="email">
                        <label for="passwordField">PASSWORD</label>
                        <input id="passwordField" type="password">                    
                    </div>
                    <div>
                        <label for="lnameField">LAST NAME</label>
                        <input id="lnameField" type="text">
                        <label for="phoneField">PHONE NUMBER</label>
                        <input id="phoneField" type="text"> 
                        <label for="passwordConfirmField">CONFIRM PASSWORD</label>
                        <input id="passwordConfirmField" type="password">                                                             
                    </div>
                    <div>
                        <img src="Images/WorkOfArt.jpeg" id ="squidword">
                        <img src="Images/Frame.png" id ="frame">
                    </div>
                </div>
                <div class="submitDiv">
                    <button type="submit" id="submitButton">Create Account</button>
                    <span id="logIn">Already have an account? <a href="example.com">Log in</a></span>                        
                </div>                 
            </form>

        </div>
    </div>

</body>
</html>
